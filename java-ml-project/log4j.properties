# Log4j configuration to suppress Spark info logs
# Only show WARN and ERROR messages

# Set root logger level to ERROR (even more restrictive)
log4j.rootLogger=ERROR, console

# Console appender configuration
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Suppress specific Spark loggers
log4j.logger.org.apache.spark=WARN
log4j.logger.org.apache.spark.SparkContext=WARN
log4j.logger.org.apache.spark.SparkConf=WARN
log4j.logger.org.apache.spark.sql=WARN
log4j.logger.org.apache.spark.sql.SparkSession=WARN
log4j.logger.org.apache.spark.sql.execution=WARN
log4j.logger.org.apache.spark.sql.catalyst=WARN
log4j.logger.org.apache.spark.ml=WARN
log4j.logger.org.apache.spark.mllib=WARN
log4j.logger.org.apache.spark.util=WARN
log4j.logger.org.apache.spark.scheduler=WARN
log4j.logger.org.apache.spark.storage=WARN
log4j.logger.org.apache.spark.network=WARN
log4j.logger.org.apache.spark.shuffle=WARN
log4j.logger.org.apache.spark.executor=WARN
log4j.logger.org.apache.spark.deploy=WARN
log4j.logger.org.apache.spark.ui=WARN

# Suppress other verbose loggers
log4j.logger.org.apache.hadoop=ERROR
log4j.logger.org.apache.hadoop.util=ERROR
log4j.logger.org.apache.hadoop.conf=ERROR
log4j.logger.org.apache.hadoop.fs=ERROR
log4j.logger.org.apache.hadoop.io=ERROR
log4j.logger.org.apache.hadoop.security=ERROR
log4j.logger.org.apache.hadoop.yarn=ERROR
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=ERROR

# Suppress Jetty logs (used by Spark UI)
log4j.logger.org.eclipse.jetty=ERROR
log4j.logger.org.eclipse.jetty.server=ERROR
log4j.logger.org.eclipse.jetty.util=ERROR
log4j.logger.org.eclipse.jetty.io=ERROR

# Suppress Akka logs (used by Spark)
log4j.logger.akka=WARN
log4j.logger.akka.actor=WARN
log4j.logger.akka.remote=WARN
log4j.logger.akka.event=WARN

# Suppress additional verbose loggers
log4j.logger.org.apache.spark.sql.execution.adaptive=ERROR
