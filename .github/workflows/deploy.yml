# Deploy Java Workshop on push to java_workshop
# Builds Lambda (sentiment-spark → Lambda image), frontend, deploys to S3 + CloudFront

name: Deploy Java Workshop

on:
  push:
    branches: [java_workshop]
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 1. Build Java model (existing java-ml-project Dockerfile)
      - name: Build sentiment-spark (Java model)
        run: docker build -t sentiment-spark java-ml-project

      # 2. Build Lambda image (uses sentiment-spark as source)
      - name: Build Lambda image
        run: docker build -f sentiment-api/Dockerfile.lambda -t sentiment-api-lambda .

      - name: Tag and push Lambda image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_NAME }}
        run: |
          docker tag sentiment-api-lambda:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Update Lambda function
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --image-uri ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest
          aws lambda wait function-updated \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Update Lambda env (Google Sheets from GitHub)
        if: vars.GOOGLE_SHEET_ID != ''
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          CURRENT=$(aws lambda get-function-configuration \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'Environment.Variables' --output json 2>/dev/null || echo '{}')
          ENV_JSON=$(echo "$CURRENT" | jq --arg sheet "$GOOGLE_SHEET_ID" --arg sjson "$GOOGLE_SERVICE_ACCOUNT_JSON" \
            '.GOOGLE_SHEET_ID = $sheet | .GOOGLE_SERVICE_ACCOUNT_JSON = $sjson | {Variables: .}')
          aws lambda update-function-configuration \
            --function-name ${{ vars.LAMBDA_FUNCTION_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --environment "$ENV_JSON"

      # Frontend build and deploy
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd java-ml-project/viewer && npm install

      - name: Build frontend
        env:
          VITE_SENTIMENT_API_URL: ${{ vars.API_URL }}
        run: cd java-ml-project/viewer && npm run build

      - name: Create deployment bucket and deploy
        id: frontend-deploy
        env:
          BUCKET_BASE: ${{ vars.FRONTEND_BUCKET_BASE || 'java-workshop-frontend' }}
          CF_DIST_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          SUFFIX=$(date +%s)
          BUCKET="${BUCKET_BASE}-${SUFFIX}"
          echo "bucket_name=${BUCKET}" >> $GITHUB_OUTPUT
          aws s3 mb "s3://${BUCKET}" --region ${{ env.AWS_REGION }}
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          CF_ARN="arn:aws:cloudfront::${ACCOUNT}:distribution/${CF_DIST_ID}"
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy "{
            \"Version\": \"2012-10-17\",
            \"Statement\": [{
              \"Sid\": \"AllowCloudFront\",
              \"Effect\": \"Allow\",
              \"Principal\": {\"Service\": \"cloudfront.amazonaws.com\"},
              \"Action\": \"s3:GetObject\",
              \"Resource\": \"arn:aws:s3:::${BUCKET}/*\",
              \"Condition\": {\"StringEquals\": {\"AWS:SourceArn\": \"${CF_ARN}\"}}
            }]
          }"
          aws s3 sync java-ml-project/viewer/dist "s3://${BUCKET}/" --delete
          echo "Deployed to s3://${BUCKET}/"

      - name: Update CloudFront origin
        env:
          BUCKET: ${{ steps.frontend-deploy.outputs.bucket_name }}
          CF_DIST_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          ETAG=$(aws cloudfront get-distribution-config --id "$CF_DIST_ID" --query ETag --output text)
          CONFIG=$(aws cloudfront get-distribution-config --id "$CF_DIST_ID" --output json)
          ORIGIN_ID="S3-${BUCKET}"
          DOMAIN="${BUCKET}.s3.${AWS_REGION}.amazonaws.com"
          echo "$CONFIG" | jq --arg domain "$DOMAIN" --arg id "$ORIGIN_ID" \
            '.DistributionConfig.Origins.Items[0].DomainName = $domain |
             .DistributionConfig.Origins.Items[0].Id = $id |
             .DistributionConfig.DefaultCacheBehavior.TargetOriginId = $id |
             .DistributionConfig' | jq -c '.' > /tmp/cf-config.json
          aws cloudfront update-distribution --id "$CF_DIST_ID" --if-match "$ETAG" \
            --distribution-config file:///tmp/cf-config.json

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
